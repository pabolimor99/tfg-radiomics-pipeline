setting:
  # Discretization (HU) for texture features.
  # Common defaults in CT radiomics are 25 HU or 10 HU; start with 25 for stability.
  binWidth: 25
  normalize: false
  removeOutliers: null
  resampledPixelSpacing: null
  interpolator: sitkBSpline
  preCrop: false
  padDistance: 5
  label: 1

imageType:
  Original: {}

featureClass:
  firstorder: []
  shape: []
  glcm: []
  glrlm: []
  glszm: []
  gldm: []
  ngtdm: []

